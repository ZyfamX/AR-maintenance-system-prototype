<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Scanner — CMS</title>

    <!-- A-Frame + AR.js -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        /* ── Reset & Base ───────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            overflow: hidden;
            height: 100dvh;
            width: 100vw;
        }

        /* ── A-Frame Scene (AR Camera Feed) ─────────────────── */
        #arScene {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        /* ── 2D Overlay (sits above AR scene) ───────────────── */
        #overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none; /* Let touches pass through to camera by default */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* ── Top Bar ─────────────────────────────────────────── */
        #top-bar {
            pointer-events: all;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(8px);
            padding: 10px 16px;
            border-bottom: 1px solid rgba(71, 85, 105, 0.5);
        }

        #top-bar h1 {
            font-size: 1rem;
            font-weight: 700;
            color: #f8fafc;
            letter-spacing: 0.05em;
        }

        #status {
            font-size: 0.8rem;
            color: #f0c040;
            flex: 1;
            text-align: right;
            padding-left: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ── Bottom Sheet Info Panel ─────────────────────────── */
        /*
         * This panel slides up from the bottom when a marker is found.
         * Matches the wireframe golden card over the camera feed.
         */
        #info-panel {
            pointer-events: all;
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 20;
            background: rgba(180, 130, 20, 0.92); /* golden, like wireframe */
            backdrop-filter: blur(12px);
            border-radius: 20px 20px 0 0;
            border-top: 2px solid rgba(255, 220, 100, 0.5);
            padding: 16px 20px 24px;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: 200px;
        }

        #info-panel.visible {
            transform: translateY(0);
        }

        #panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        #panel-title {
            font-size: 1rem;
            font-weight: 700;
            color: #1e293b;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        #panel-close {
            background: none;
            border: none;
            color: #1e293b;
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
            padding: 4px 8px;
        }

        /* ── Info Rows ───────────────────────────────────────── */
        .ar-info-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-size: 0.9rem;
            color: #1e293b;
            padding: 2px 0;
        }

        .ar-label {
            font-weight: 700;
            flex-shrink: 0;
        }

        .ar-divider {
            border: none;
            border-top: 1px dashed rgba(30, 41, 59, 0.4);
            margin: 8px 0;
        }

        .ar-description span {
            font-size: 0.82rem;
            opacity: 0.85;
        }

        /* ── Action Button (Check-In / Check-Out) ────────────── */
        .ar-action-btn {
            display: block;
            width: 160px;
            margin: 16px auto 0;
            padding: 12px 0;
            border: none;
            border-radius: 999px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.03em;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .ar-action-btn:active { transform: scale(0.96); }
        .ar-action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .ar-btn-checkout {
            background: #bbf7d0; /* soft green — wireframe */
            color: #065f46;
        }

        .ar-btn-checkin {
            background: #fecaca; /* soft red — wireframe */
            color: #7f1d1d;
        }

        /* ── Bottom Nav Bar ──────────────────────────────────── */
        #bottom-nav {
            pointer-events: all;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px 20px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            border-top: 1px solid rgba(71, 85, 105, 0.4);
        }

        #btn-home {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: #3b82f6;
            border: none;
            cursor: pointer;
            font-size: 1.6rem;
            flex-shrink: 0;
            transition: background 0.2s;
        }
        #btn-home:hover { background: #2563eb; }

        /* ── Mode Switch (Tool / Fault) ──────────────────────── */
        #mode-switch {
            flex: 1;
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 5px;
            gap: 4px;
        }

        .mode-btn {
            flex: 1;
            padding: 10px 0;
            border: none;
            border-radius: 9px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.04em;
            transition: background 0.2s, color 0.2s;
            background: transparent;
            color: rgba(255,255,255,0.45);
        }

        /* Active state for Tool mode */
        .mode-btn.active-tool {
            background: #f97316;
            color: #fff;
        }

        /* Active state for Fault mode */
        .mode-btn.active-fault {
            background: #ef4444;
            color: #fff;
        }

        /* ── Fallback Screen ─────────────────────────────────── */
        #fallback {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 40px;
            text-align: center;
        }

        #fallback.hidden { display: none; }

        #fallback .fallback-icon { font-size: 4rem; }

        #fallback h2 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #f8fafc;
        }

        #fallback p {
            color: #94a3b8;
            font-size: 0.95rem;
            max-width: 320px;
            line-height: 1.5;
        }

        #fallback a {
            color: #f97316;
            text-decoration: underline;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- ── Fallback (camera unavailable) ───────────────────── -->
    <div id="fallback" class="hidden">
        <div class="fallback-icon">📷</div>
        <h2>Camera Unavailable</h2>
        <p id="fallback-msg">Camera permission was denied or the camera is unavailable.</p>
        <a href="/">← Return to Dashboard</a>
    </div>


    <!-- ── AR Scene (A-Frame + AR.js — barcode markers 1–20) ──── -->
    <!--
        BARCODE MARKERS (3x3 matrix type)
        ==================================
        Each <a-marker> below listens for the corresponding physical printed marker.
        The `value` attribute is the barcode number — this must match the marker_id
        stored on the tool or fault in your database.

        Print markers from:
          https://github.com/nicolocarpignoli/artoolkit-barcode-markers-collection/tree/master/3x3
        or generate them at:
          https://au.gmented.com/app/marker/marker.php

        To add more markers, duplicate a block and change `value` and `id`.
        To use fewer markers, simply remove the blocks you don't need.
    -->
    <a-scene
        id="arScene"
        embedded
        arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; antialias: true;"
        loading-screen="enabled: false"
    >
        <!-- Barcode 1: set marker_id = "1" on your tool or fault in the DB -->
        <a-marker type="barcode" value="1" id="barcode-1">
            <a-box position="0 0.5 0" material="color: #f97316;" scale="0.4 0.4 0.4"></a-box>
        </a-marker>

        <!-- Barcode 2: set marker_id = "2" on your tool or fault in the DB -->
        <a-marker type="barcode" value="2" id="barcode-2">
            <a-box position="0 0.5 0" material="color: #f97316;" scale="0.4 0.4 0.4"></a-box>
        </a-marker>

        <!-- Barcode 3: set marker_id = "3" on your tool or fault in the DB -->
        <a-marker type="barcode" value="3" id="barcode-3">
            <a-box position="0 0.5 0" material="color: #f97316;" scale="0.4 0.4 0.4"></a-box>
        </a-marker>

        <!-- Barcode 4: set marker_id = "4" on your tool or fault in the DB -->
        <a-marker type="barcode" value="4" id="barcode-4">
            <a-box position="0 0.5 0" material="color: #f97316;" scale="0.4 0.4 0.4"></a-box>
        </a-marker>

        <!-- Barcode 5: set marker_id = "5" on your tool or fault in the DB -->
        <a-marker type="barcode" value="5" id="barcode-5">
            <a-box position="0 0.5 0" material="color: #f97316;" scale="0.4 0.4 0.4"></a-box>
        </a-marker>

        <!-- Barcode 6: set marker_id = "6" on your tool or fault in the DB -->
        <a-marker type="barcode" value="6" id="barcode-6">
            <a-box position="0 0.5 0" material="color: #f97316;" scale="0.4 0.4 0.4"></a-box>
        </a-marker>

        <!-- Barcode 7: set marker_id = "7" on your tool or fault in the DB -->
        <a-marker type="barcode" value="7" id="barcode-7">
            <a-box position="0 0.5 0" material="color: #f97316;" scale="0.4 0.4 0.4"></a-box>
        </a-marker>

        <!-- Barcode 8: set marker_id = "8" on your tool or fault in the DB -->
        <a-marker type="barcode" value="8" id="barcode-8">
            <a-box position="0 0.5 0" material="color: #f97316;" scale="0.4 0.4 0.4"></a-box>
        </a-marker>

        <!-- Barcode 9: set marker_id = "9" on your tool or fault in the DB -->
        <a-marker type="barcode" value="9" id="barcode-9">
            <a-box position="0 0.5 0" material="color: #f97316;" scale="0.4 0.4 0.4"></a-box>
        </a-marker>

        <!-- Barcode 10: set marker_id = "10" on your tool or fault in the DB -->
        <a-marker type="barcode" value="10" id="barcode-10">
            <a-box position="0 0.5 0" material="color: #f97316;" scale="0.4 0.4 0.4"></a-box>
        </a-marker>

        <!-- Barcode 11: set marker_id = "11" on your tool or fault in the DB -->
        <a-marker type="barcode" value="11" id="barcode-11">
            <a-box position="0 0.5 0" material="color: #f97316;" scale="0.4 0.4 0.4"></a-box>
        </a-marker>

        <!-- Barcode 12: set marker_id = "12" on your tool or fault in the DB -->
        <a-marker type="barcode" value="12" id="barcode-12">
            <a-box position="0 0.5 0" material="color: #f97316;" scale="0.4 0.4 0.4"></a-box>
        </a-marker>

        <!-- Barcode 13: set marker_id = "13" on your tool or fault in the DB -->
        <a-marker type="barcode" value="13" id="barcode-13">
            <a-box position="0 0.5 0" material="color: #f97316;" scale="0.4 0.4 0.4"></a-box>
        </a-marker>

        <!-- Barcode 14: set marker_id = "14" on your tool or fault in the DB -->
        <a-marker type="barcode" value="14" id="barcode-14">
            <a-box position="0 0.5 0" material="color: #f97316;" scale="0.4 0.4 0.4"></a-box>
        </a-marker>

        <!-- Barcode 15: set marker_id = "15" on your tool or fault in the DB -->
        <a-marker type="barcode" value="15" id="barcode-15">
            <a-box position="0 0.5 0" material="color: #f97316;" scale="0.4 0.4 0.4"></a-box>
        </a-marker>

        <!-- Barcode 16: set marker_id = "16" on your tool or fault in the DB -->
        <a-marker type="barcode" value="16" id="barcode-16">
            <a-box position="0 0.5 0" material="color: #f97316;" scale="0.4 0.4 0.4"></a-box>
        </a-marker>

        <!-- Barcode 17: set marker_id = "17" on your tool or fault in the DB -->
        <a-marker type="barcode" value="17" id="barcode-17">
            <a-box position="0 0.5 0" material="color: #f97316;" scale="0.4 0.4 0.4"></a-box>
        </a-marker>

        <!-- Barcode 18: set marker_id = "18" on your tool or fault in the DB -->
        <a-marker type="barcode" value="18" id="barcode-18">
            <a-box position="0 0.5 0" material="color: #f97316;" scale="0.4 0.4 0.4"></a-box>
        </a-marker>

        <!-- Barcode 19: set marker_id = "19" on your tool or fault in the DB -->
        <a-marker type="barcode" value="19" id="barcode-19">
            <a-box position="0 0.5 0" material="color: #f97316;" scale="0.4 0.4 0.4"></a-box>
        </a-marker>

        <!-- Barcode 20: set marker_id = "20" on your tool or fault in the DB -->
        <a-marker type="barcode" value="20" id="barcode-20">
            <a-box position="0 0.5 0" material="color: #f97316;" scale="0.4 0.4 0.4"></a-box>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>


    <!-- ── 2D Overlay ─────────────────────────────────────── -->
    <div id="overlay">

        <!-- Top Bar -->
        <div id="top-bar">
            <h1>⚙️ CMS: AR SCANNER</h1>
            <span id="status">Point camera at a marker…</span>
        </div>

        <!-- Spacer (transparent middle — let AR through) -->
        <div style="flex: 1;"></div>

        <!-- Bottom Nav -->
        <div id="bottom-nav">
            <button id="btn-home" aria-label="Home">🏠</button>

            <!--
                Mode Switch: sets the scan mode in ar.js.
                TOOL mode  → looks up marker_id in tools,  shows check-in/out.
                FAULT mode → looks up marker_id in faults, shows fault details.
                ar.js reads window.scanMode ("tool" | "fault") on every markerFound event.
            -->
            <div id="mode-switch">
                <button class="mode-btn active-tool" id="mode-tool" aria-pressed="true">
                    🔧 TOOL
                </button>
                <button class="mode-btn" id="mode-fault" aria-pressed="false">
                    ⚠️ FAULT
                </button>
            </div>
        </div>

    </div>


    <!-- ── Info Panel (slides up on marker found) ─────────── -->
    <div id="info-panel">
        <div id="panel-header">
            <span id="panel-title">Tool View</span>
            <button id="panel-close" aria-label="Close panel">✕</button>
        </div>

        <div id="panel-body">
            <!-- Populated by ar.js -->
        </div>

        <button id="panel-action-btn" class="ar-action-btn" style="display: none;">
            Action
        </button>
    </div>


    <!-- ── Scripts ────────────────────────────────────────── -->
    <script type="module" src="/static/ar.js"></script>

    <script>
        // Close panel button — hides the overlay but keeps AR running
        document.getElementById('panel-close').addEventListener('click', () => {
            document.getElementById('info-panel').classList.remove('visible');
        });

        // ── Mode Switch Logic ──────────────────────────────────────────────
        // ar.js reads window.scanMode to know whether to look up tools or faults.
        // Default is "tool".
        window.scanMode = 'tool';

        const btnTool  = document.getElementById('mode-tool');
        const btnFault = document.getElementById('mode-fault');
        const statusEl = document.getElementById('status');

        btnTool.addEventListener('click', () => {
            window.scanMode = 'tool';
            btnTool.classList.add('active-tool');
            btnTool.setAttribute('aria-pressed', 'true');
            btnFault.classList.remove('active-fault');
            btnFault.setAttribute('aria-pressed', 'false');
            statusEl.textContent = 'Tool mode — point camera at a marker…';
            statusEl.style.color = '#f97316';
            // Close any open panel when switching modes
            document.getElementById('info-panel').classList.remove('visible');
        });

        btnFault.addEventListener('click', () => {
            window.scanMode = 'fault';
            btnFault.classList.add('active-fault');
            btnFault.setAttribute('aria-pressed', 'true');
            btnTool.classList.remove('active-tool');
            btnTool.setAttribute('aria-pressed', 'false');
            statusEl.textContent = 'Fault mode — point camera at a marker…';
            statusEl.style.color = '#ef4444';
            // Close any open panel when switching modes
            document.getElementById('info-panel').classList.remove('visible');
        });
    </script>

</body>
</html>
