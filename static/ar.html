<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Scanner — CMS</title>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="/static/ar.css">

    <!-- A-Frame + AR.js -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

</head>
<body>

    <!-- Fallback (camera unavailable) -->
    <div id="fallback" class="hidden">
        <div class="fallback-icon">📷</div>
        <h2>Camera Unavailable</h2>
        <p id="fallback-msg">Camera permission was denied or the camera is unavailable.</p>
        <a href="/">← Return to Dashboard</a>
    </div>


    <!-- AR Scene (A-Frame + AR.js — barcode markers 1–20) -->
    <!--
        BARCODE MARKERS (3x3 matrix type)
        ==================================
    -->
    <a-scene
        id="arScene"
        embedded
        arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; antialias: true;"
        loading-screen="enabled: false"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;"
    >

        <a-marker type="barcode" value="1" id="barcode-1">
        </a-marker>

        <a-marker type="barcode" value="2" id="barcode-2">
        </a-marker>

        <a-marker type="barcode" value="3" id="barcode-3">
        </a-marker>

        <a-marker type="barcode" value="4" id="barcode-4">
        </a-marker>

        <a-marker type="barcode" value="5" id="barcode-5">
        </a-marker>

        <a-marker type="barcode" value="6" id="barcode-6">
        </a-marker>

        <a-marker type="barcode" value="7" id="barcode-7">
        </a-marker>

        <a-marker type="barcode" value="8" id="barcode-8">
        </a-marker>

        <a-marker type="barcode" value="9" id="barcode-9">
        </a-marker>

        <a-marker type="barcode" value="10" id="barcode-10">
        </a-marker>

        <a-marker type="barcode" value="11" id="barcode-11">
        </a-marker>

        <a-marker type="barcode" value="12" id="barcode-12">
        </a-marker>

        <a-marker type="barcode" value="13" id="barcode-13">
        </a-marker>

        <a-marker type="barcode" value="14" id="barcode-14">
        </a-marker>

        <a-marker type="barcode" value="15" id="barcode-15">
        </a-marker>

        <a-marker type="barcode" value="16" id="barcode-16">
        </a-marker>

        <a-marker type="barcode" value="17" id="barcode-17">
        </a-marker>

        <a-marker type="barcode" value="18" id="barcode-18">
        </a-marker>

        <a-marker type="barcode" value="19" id="barcode-19">
        </a-marker>

        <a-marker type="barcode" value="20" id="barcode-20">
        </a-marker>

        <a-marker type="barcode" value="21" id="barcode-21">
        </a-marker>

        <a-marker type="barcode" value="22" id="barcode-22">
        </a-marker>

        <a-marker type="barcode" value="23" id="barcode-23">
        </a-marker>

        <a-marker type="barcode" value="24" id="barcode-24">
        </a-marker>

        <a-marker type="barcode" value="25" id="barcode-25">
        </a-marker>

        <a-marker type="barcode" value="26" id="barcode-26">
        </a-marker>

        <a-marker type="barcode" value="27" id="barcode-27">
        </a-marker>

        <a-marker type="barcode" value="28" id="barcode-28">
        </a-marker>

        <a-marker type="barcode" value="29" id="barcode-29">
        </a-marker>

        <a-marker type="barcode" value="30" id="barcode-30">
        </a-marker>

        <a-marker type="barcode" value="31" id="barcode-31">
        </a-marker>

        <a-marker type="barcode" value="32" id="barcode-32">
        </a-marker>

        <a-marker type="barcode" value="33" id="barcode-33">
        </a-marker>

        <a-marker type="barcode" value="34" id="barcode-34">
        </a-marker>

        <a-marker type="barcode" value="35" id="barcode-35">
        </a-marker>

        <a-marker type="barcode" value="36" id="barcode-36">
        </a-marker>

        <a-marker type="barcode" value="37" id="barcode-37">
        </a-marker>

        <a-marker type="barcode" value="38" id="barcode-38">
        </a-marker>

        <a-marker type="barcode" value="39" id="barcode-39">
        </a-marker>

        <a-marker type="barcode" value="40" id="barcode-40">
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>


    <!-- 2D Overlay -->
    <div id="overlay">

        <!-- Top Bar -->
        <div id="top-bar">
            <h1>⚙️ CMS: AR SCANNER</h1>
            <span id="status">Point camera at a marker…</span>
        </div>

        <!-- Spacer (transparent middle — let AR through) -->
        <div style="flex: 1;"></div>

        <!-- Bottom Nav -->
        <div id="bottom-nav">
            <button id="btn-home" aria-label="Home">🏠</button>

            <!--
                Mode Switch: sets the scan mode in ar.js.
                TOOL mode  → looks up marker_id in tools,  shows check-in/out.
                FAULT mode → looks up marker_id in faults, shows fault details.
                ar.js reads window.scanMode ("tool" | "fault") on every markerFound event.
            -->
            <div id="mode-switch">
                <button class="mode-btn active-tool" id="mode-tool" aria-pressed="true">
                    🔧 TOOL
                </button>
                <button class="mode-btn" id="mode-fault" aria-pressed="false">
                    ⚠️ FAULT
                </button>
            </div>
        </div>

    </div>


    <!-- Info Panel (slides up on marker found) -->
    <div id="info-panel">
        <div id="panel-header">
            <span id="panel-title">Tool View</span>
            <button id="panel-close" aria-label="Close panel">✕</button>
        </div>

        <div id="panel-body">
            <!-- Populated by ar.js -->
        </div>

        <button id="panel-action-btn" class="ar-action-btn" style="display: none;">
            Action
        </button>
    </div>


    <!-- AR Fault Details Modal -->
    <div id="ar-fault-modal" class="hidden">
        <div class="ar-modal-content">
            <div class="ar-modal-header">
                <h2 id="ar-modal-title">Fault Report</h2>
                <button id="ar-modal-close" aria-label="Close modal">✕</button>
            </div>
            <div id="ar-modal-body">
                <!-- Populated dynamically by ar.js -->
            </div>
        </div>
    </div>


    <!-- AR Create Fault Modal -->
    <div id="ar-create-fault-modal" class="hidden">
        <div class="ar-modal-content">
            <div class="ar-modal-header">
                <h2>Log New Fault</h2>
                <button id="ar-create-close" aria-label="Close modal">✕</button>
            </div>
            <div id="ar-create-body" style="padding: 20px;">
                <form id="ar-create-fault-form">
                    <input type="hidden" id="create-marker-id">
                    
                    <div style="margin-bottom: 15px;">
                        <label style="display:block; color:#94a3b8; font-size:0.85rem; margin-bottom:5px;">Marker ID</label>
                        <input type="text" id="create-marker-display" disabled style="width: 100%; padding: 10px; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 6px;">
                    </div>

                    <div style="margin-bottom: 15px;">
                        <label style="display:block; color:#94a3b8; font-size:0.85rem; margin-bottom:5px;">Title (Min 5 chars)</label>
                        <input type="text" id="create-title" required minlength="5" maxlength="100" placeholder="e.g. Broken Pipe" style="width: 100%; padding: 10px; background: #1e293b; color: #f8fafc; border: 1px solid #475569; border-radius: 6px;">
                    </div>
                    
                    <div style="margin-bottom: 15px;">
                        <label style="display:block; color:#94a3b8; font-size:0.85rem; margin-bottom:5px;">Rec. Priority</label>
                        <select id="create-priority" required style="width: 100%; padding: 10px; background: #1e293b; color: #f8fafc; border: 1px solid #475569; border-radius: 6px;">
                            <option value="" disabled selected>-- Select Assessment --</option>
                            <option value="High">High</option>
                            <option value="Medium">Medium</option>
                            <option value="Low">Low</option>
                        </select>
                    </div>

                    <div style="margin-bottom: 15px;">
                        <label style="display:block; color:#94a3b8; font-size:0.85rem; margin-bottom:5px;">Location</label>
                        <input type="text" id="create-location" required minlength="3" maxlength="100" placeholder="e.g. Boiler Room" style="width: 100%; padding: 10px; background: #1e293b; color: #f8fafc; border: 1px solid #475569; border-radius: 6px;">
                    </div>
                    
                    <div style="margin-bottom: 20px;">
                        <label style="display:block; color:#94a3b8; font-size:0.85rem; margin-bottom:5px;">Description (Min 10 chars)</label>
                        <textarea id="create-description" required minlength="10" maxlength="500" rows="3" placeholder="Provide details of the fault..." style="width: 100%; padding: 10px; background: #1e293b; color: #f8fafc; border: 1px solid #475569; border-radius: 6px; resize: vertical;"></textarea>
                    </div>
                    
                    <button type="submit" id="btn-submit-new-fault" style="width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: background 0.2s;">Submit Report</button>
                </form>
            </div>
        </div>
    </div>


    <!-- Scripts -->
    <script type="module" src="/static/ar.js"></script>

    <script>
        // Close panel button — hides the overlay but keeps AR running
        document.getElementById('panel-close').addEventListener('click', () => {
            document.getElementById('info-panel').classList.remove('visible');
        });

        // Mode Switch Logic
        // ar.js reads window.scanMode to know whether to look up tools or faults.
        // Default is "tool".
        window.scanMode = 'tool';

        const btnTool  = document.getElementById('mode-tool');
        const btnFault = document.getElementById('mode-fault');
        const statusEl = document.getElementById('status');

        btnTool.addEventListener('click', () => {
            window.scanMode = 'tool';
            btnTool.classList.add('active-tool');
            btnTool.setAttribute('aria-pressed', 'true');
            btnFault.classList.remove('active-fault');
            btnFault.setAttribute('aria-pressed', 'false');
            statusEl.textContent = 'Tool mode — point camera at a marker…';
            statusEl.style.color = '#f97316';
            // Close any open panel when switching modes
            document.getElementById('info-panel').classList.remove('visible');
        });

        btnFault.addEventListener('click', () => {
            window.scanMode = 'fault';
            btnFault.classList.add('active-fault');
            btnFault.setAttribute('aria-pressed', 'true');
            btnTool.classList.remove('active-tool');
            btnTool.setAttribute('aria-pressed', 'false');
            statusEl.textContent = 'Fault mode — point camera at a marker…';
            statusEl.style.color = '#ef4444';
            // Close any open panel when switching modes
            document.getElementById('info-panel').classList.remove('visible');
        });
    </script>

</body>
</html>
